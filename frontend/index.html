<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Global Error Reporting to Native Android
        window.onerror = function(message, source, lineno, colno, error) {
            var errorMsg = message + " at " + source + ":" + lineno + ":" + colno;
            if (window.Android && window.Android.logError) {
                window.Android.logError(errorMsg);
            }
            return false;
        };
        // Catch Promise Rejections
        window.onunhandledrejection = function(event) {
            var errorMsg = "Unhandled Rejection: " + event.reason;
            if (window.Android && window.Android.logError) {
                window.Android.logError(errorMsg);
            }
        };
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-user-select: none; 
            user-select: none;
            overscroll-behavior-y: contain;
        }
        .glass-nav { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.85); border-top: 1px solid rgba(0, 0, 0, 0.05); }
        .bg-cream { background-color: #fdfcf0; }
        .text-islamic-green { color: #052e16; }
        .bg-islamic-green { background-color: #052e16; }
        .border-islamic-green { border-color: #052e16; }
        
        /* Custom animations for Tarbiyah */
        @keyframes float-calm {
          0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
          20% { opacity: 0.3; } 
          80% { opacity: 0.3; }
          100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }
        .bg-icon-calm {
          position: absolute;
          opacity: 0;
          animation: float-calm linear infinite;
          will-change: transform;
        }
        @keyframes shimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* RTL Support for Urdu */
        [dir="rtl"] { text-align: right; }
        [dir="rtl"] .text-left { text-align: right; }
        [dir="rtl"] .text-right { text-align: left; }
        [dir="rtl"] .ml-2, [dir="rtl"] .ml-1 { margin-left: 0; margin-right: 0.5rem; }
        [dir="rtl"] .mr-2, [dir="rtl"] .mr-1 { margin-right: 0; margin-left: 0.5rem; }
        [dir="rtl"] .pl-5 { padding-left: 0; padding-right: 1.25rem; }
        [dir="rtl"] .pr-4 { padding-right: 0; padding-left: 1rem; }
        [dir="rtl"] .border-l-4 { border-left-width: 0; border-right-width: 4px; }
        [dir="rtl"] .rounded-tl-none { border-top-left-radius: 1.75rem; border-top-right-radius: 0; }
        [dir="rtl"] .rounded-tr-sm { border-top-right-radius: 1.75rem; border-top-left-radius: 0.125rem; }
        [dir="rtl"] .space-x-2 > :not([hidden]) ~ :not([hidden]) { margin-left: 0; margin-right: 0.5rem; }
        
        @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap');
        .arabic-text {
            font-family: 'Amiri', serif;
            line-height: 2.2;
        }

        /* 📱 Mobile App Scaling Overrides */
        .is-phone-app {
            font-size: 14px; /* Base app font size */
        }
        .is-phone-app h1 { font-size: 1.5rem !important; }
        .is-phone-app h2 { font-size: 1.25rem !important; }
        .is-phone-app .text-4xl, .is-phone-app .text-5xl, .is-phone-app .text-6xl, .is-phone-app .text-7xl, .is-phone-app .text-8xl { 
            font-size: 1.75rem !important; 
            line-height: 1.2 !important;
        }
        .is-phone-app .p-10, .is-phone-app .p-16, .is-phone-app .p-20 { 
            padding: 1.5rem !important; 
        }
        .is-phone-app .py-20, .is-phone-app .py-32 {
            padding-top: 2rem !important;
            padding-bottom: 2rem !important;
        }
        .is-phone-app .gap-8, .is-phone-app .gap-12, .is-phone-app .gap-16 {
            gap: 1rem !important;
        }
        /* Lock everything to vertical on "phone" layout if needed */
        .is-phone-app .flex-row-mobile-force {
            flex-direction: column !important;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-cream text-slate-900 overflow-x-hidden">
    <div id="root" style="background-color: #052e16; min-height: 100vh;">
        <!-- 🚦 EMERGENCY FALLBACK: If the screen is still blank, this proves JS is not running at all -->
        <div id="fallback-loader" style="background-color: #052e16; color: #fdfcf0; height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; z-index: 9999;">
            <img src="/imam_logo.png" alt="Logo" style="height: 80px; margin-bottom: 20px;">
            <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -0.05em;">LOADING IMAM...</h1>
            <p style="font-size: 12px; opacity: 0.7; margin-top: 10px;">Please wait while we connect to faith...</p>
        </div>
        <script>
            // 🧪 STUCK LOADER RECOVERY
            // If React doesn't mount and clear the fallback loader within 15 seconds,
            // it might be a network glitch or a JS crash. Try one reload.
            setTimeout(function() {
                var loader = document.getElementById('fallback-loader');
                if (loader && !window.__REACT_HYDRATED__) {
                    console.log("App seems stuck. Attempting recovery...");
                    if (!sessionStorage.getItem('has_recovered')) {
                        sessionStorage.setItem('has_recovered', 'true');
                        window.location.reload();
                    }
                }
            }, 15000);
        </script>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
